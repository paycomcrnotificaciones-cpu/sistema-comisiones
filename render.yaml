# Configuración de la API en Render. Las claves secretas se cargan a mano
# en el panel (sync: false): nunca se guardan en el repositorio.
services:
  - type: web
    name: paycom-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://sistema-comisiones-5rqh.netlify.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: paycomcr.notificaciones@gmail.com
      - key: SMTP_FROM
        value: paycomcr.notificaciones@gmail.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_RELAY_URL
        sync: false
      - key: CORREO_RELAY_SECRET
        sync: false
